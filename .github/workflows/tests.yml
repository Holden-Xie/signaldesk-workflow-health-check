name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify checked-in report is reproducible
        run: |
          python signaldesk_health.py --output /tmp/REPORT.md >/dev/null
          diff --strip-trailing-cr -u REPORT.md /tmp/REPORT.md
